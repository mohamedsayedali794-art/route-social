<app-navbar></app-navbar>

<section class="bg-red-700 my-2 p-20 rounded border">
    <div class="container grid  md:grid-cols-3  gap-3">
       @for (movie of allMovies; track movie.id) {
         <div class="bg-white shadow rounded border">
            <img [src]="'https://image.tmdb.org/t/p/w500' +  movie.poster_path" class="w-full" alt=""/>
            <h3>
                {{movie.name? 'name ' + movie.name  :'title '+ movie.title}}
            </h3>
            <p>{{movie.overview.split(' ',10).join('')}}</p>

        </div>

       }
    </div>

</section>
<button (click)="getMovies()" class="">get movies</button>
