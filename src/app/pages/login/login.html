<div class="min-h-screen flex items-center justify-center bg-slate-100 p-4">
  <div class="w-full max-w-sm bg-white rounded-3xl shadow-sm p-5">
    <h2 class="text-2xl font-extrabold text-slate-900">Create a new account</h2>
    <p class="text-sm text-slate-500 mt-1 mb-5">It is quick and easy.</p>

    <form class="space-y-3" [formGroup]="Loading" (ngSubmit)="onSubmit()">
      

      <!-- Email -->
      <div class="relative">
        <i class="fa-solid fa-at absolute start-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input
          type="email"
          formControlName="email"
          placeholder="Email address"
          class="w-full h-12 ps-11 pe-4 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-800 placeholder:text-slate-400 focus:outline-none focus:border-[#0b1f5c] focus:ring-2 focus:ring-[#0b1f5c]/15"
        />
      </div>

      <!-- Password -->
      <div class="relative">
        <i class="fa-solid fa-key absolute start-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input
          type="password"
          formControlName="password"
          placeholder="Password"
          class="w-full h-12 ps-11 pe-4 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-800 placeholder:text-slate-400 focus:outline-none focus:border-[#0b1f5c] focus:ring-2 focus:ring-[#0b1f5c]/15"
        />
      </div>

      <button
        type="submit"
        class="w-full h-12 cursor-pointer rounded-xl bg-[#0b1f5c] hover:bg-[#09194a] text-white text-sm font-semibold transition-colors"
      >
        Login
          @if (submitted) {
         <i class="fa-spinner animate-spin fas"></i>
       }
      </button>
    </form>
  </div>
</div>
